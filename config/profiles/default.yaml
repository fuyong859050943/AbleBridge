profile:
  id: default
  name: Default User
  description: Default AbleBridge accessibility profile
  inputs:
    keyboard:
      enabled: true
      dwell_time_ms: 0
      scan_rate_hz: 2.0
      sensitivity: 1.0
      custom_params: {}
    eyegaze:
      enabled: false
      dwell_time_ms: 500
      scan_rate_hz: 2.0
      sensitivity: 0.7
      custom_params:
        camera_id: 0
    voice:
      enabled: false
      dwell_time_ms: 0
      scan_rate_hz: 1.0
      sensitivity: 0.6
    switch:
      enabled: false
      dwell_time_ms: 300
      scan_rate_hz: 2.0
      sensitivity: 1.0
      custom_params:
        port: /dev/ttyUSB0
  outputs:
    tts:
      enabled: true
      volume: 1.0
      rate: 1.0
      pitch: 1.0
    smarthome:
      enabled: false
      volume: 1.0
      rate: 1.0
      pitch: 1.0
      custom_params:
        broker_host: localhost
        broker_port: 1883
  ai:
    provider: ollama
    model: llama3.2:latest
    base_url: http://localhost:11434
    local: true
    temperature: 0.7
    max_tokens: 256
    prediction_enabled: true
    adaptive_learning_enabled: true
    intent_confidence_threshold: 0.60
  ui:
    theme: light
    font_size: 18
    grid_layout: aac_standard
    language: en
    aac_preset: standard
