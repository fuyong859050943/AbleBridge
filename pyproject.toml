[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ablebridge"
version = "0.1.0"
description = "A universal AI-powered accessibility bridge for people with disabilities"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AbleBridge Community"}
]
keywords = [
    "accessibility", "aac", "eye-tracking", "assistive-technology",
    "disability", "inclusive", "ai", "motor-disability", "als",
    "rehabilitation", "universal-design", "open-source"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Accessibility",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "typer>=0.9",
    "rich>=13.0",
    "flask>=3.0",
    "flask-socketio>=5.3",
    "flask-cors>=4.0",
    "jinja2>=3.1",
    "numpy>=1.26",
    "sounddevice>=0.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
eyegaze = [
    "opencv-python>=4.8",
    "mediapipe>=0.10",
]
voice = [
    "vosk>=0.3.45",
    "transformers>=4.35",
    "torch>=2.0",
]
tts = [
    "pyttsx3>=2.90",
]
smarthome = [
    "paho-mqtt>=1.6",
]
ai = [
    "ollama>=0.1",
    "llama-cpp-python>=0.2",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
]
all = [
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "vosk>=0.3.45",
    "transformers>=4.35",
    "torch>=2.0",
    "pyttsx3>=2.90",
    "paho-mqtt>=1.6",
    "ollama>=0.1",
    "llama-cpp-python>=0.2",
]

[project.scripts]
ablebridge = "ablebridge.cli:main"
ablebridge-core = "ablebridge.core.engine:main"
ablebridge-gui = "ablebridge.gui.app:main"
ablebridge-setup = "ablebridge.setup:main"
ablebridge-config = "ablebridge.config_cli:main"

[project.urls]
Homepage = "https://github.com/ablebridge/ablebridge"
Documentation = "https://ablebridge.readthedocs.io"
Repository = "https://github.com/ablebridge/ablebridge"
"Bug Reports" = "https://github.com/ablebridge/ablebridge/issues"
Discussions = "https://github.com/ablebridge/ablebridge/discussions"

[tool.setuptools.packages.find]
where = ["."]
include = ["ablebridge*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "T20"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
